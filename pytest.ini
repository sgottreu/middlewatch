[pytest]
# Run from the repo root:  python3 -m pytest
# The older script-style checks (story_pipeline/tests, ambience_pipeline/tests)
# still run on their own with `python3 -m ...`; this suite lives in tests/.
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    slow: renders audio or video; skip with -m "not slow"
    needs_ffmpeg: calls the ffmpeg binary
xfail_strict = true
