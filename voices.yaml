# The voice library: names the pipeline uses -> ElevenLabs voice ids.
#
# Tracked in git, unlike config.yaml, so a cast applied on one machine narrates
# the same on every other. Not secret: an id only works with the account's API
# key, which lives in .env.
#
# Names are labels, not claims about the voice — genre files, bibles and story
# manifests refer to these names. Edit by hand, or let these write it:
#   python3 -m story_pipeline.cli voices      # your account's ids, flagged against this
#   python3 scripts/sync-voices.py            # put your account's ids in here
#   the Casting page's Apply                  # adds the voices you cast
